name: Build and Upload Utils Package

on:
  push:
    paths:
      - 'src/utils/**'
      - '.github/workflows/build-and-upload-utils.yml'
    branches:
      - main
  workflow_dispatch:  # Allow manual triggering

env:
  PYTHON_VERSION: '3.9'
  UTILS_DIR: 'src/utils'
  SCRIPT_DIR: 'src/utils'

jobs:
  build-and-upload:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build wheel setuptools

      - name: Build wheel package
        run: |
          python setup.py bdist_wheel
          rm -r b2b_utils.egg-info
          rm -r build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Upload to S3 etl utils
        env:
          S3_BUCKET: ${{ secrets.S3_BUCKET }}
        run: |
          WHEEL_FILE=$(find ${{ env.UTILS_DIR }}/dist -name "*.whl")
          echo "Found wheel file: $WHEEL_FILE"
          echo "Checking S3 bucket configuration..."
          
          # Ensure S3 bucket is not empty
          if [ -z "$S3_BUCKET" ]; then
            echo "Error: S3_BUCKET environment variable is empty. Please ensure S3_BUCKET secret is properly set in repository settings."
            exit 1
          fi
          
          # Construct and verify S3 path
          S3_PATH="s3://${S3_BUCKET}/etl-artifacts/code/utils-0.1-py3-none-any.whl"
          echo "Uploading to: $S3_PATH"
          
          aws s3 cp "$WHEEL_FILE" "$S3_PATH"

      - name: Upload to S3 etl code
        env:
          S3_BUCKET: ${{ secrets.S3_BUCKET }}
        run: |
             aws s3 cp src/etl-artifacts/glue_jobs/scripts s3://${S3_BUCKET}/etl-artifacts/code/ \
                 --recursive \