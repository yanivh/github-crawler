name: Build and Upload Utils Package

on:
  push:
    paths:
      - 'src/utils/**'
      - '.github/workflows/build-and-upload-utils.yml'
    branches:
      - main
  workflow_dispatch:  # Allow manual triggering

jobs:
  build-and-upload:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build wheel setuptools

      - name: Create setup.py
        run: |
          cat > src/utils/setup.py << 'EOL'
          from setuptools import setup, find_packages

          setup(
              name="utils",
              version="0.1",
              packages=find_packages(),
              install_requires=[
                  "PyGithub==2.2.0",
                  "python-dotenv==1.0.1",
                  "requests==2.31.0",
                  "tqdm==4.66.2",
                  "pyarrow",
                  "boto3"
              ],
          )
          EOL

      - name: Create __init__.py
        run: |
          touch src/utils/__init__.py

      - name: Build wheel package
        run: |
          cd src/utils
          python -m build --wheel

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Upload to S3
        env:
          S3_BUCKET: ${{ secrets.DEFAULT_S3_BUCKET }}
          S3_PREFIX: "glue/etl-artifacts/code"
        run: |
          echo "Using S3 bucket: $S3_BUCKET"
          echo "Using S3 prefix: $S3_PREFIX"
          WHEEL_FILE=$(find src/utils/dist -name "*.whl")
          echo "Found wheel file: $WHEEL_FILE"
          aws s3 cp "$WHEEL_FILE" "s3://${S3_BUCKET}/${S3_PREFIX}/utils-0.1-py3-none-any.whl" 