name: Build and Upload Utils Package

on:
  push:
    paths:
      - 'src/utils/**'
      - '.github/workflows/build-and-upload-utils.yml'
      - 'setup.py'
    branches:
      - main
  workflow_dispatch:  # Allow manual triggering

env:
  PYTHON_VERSION: '3.9'

jobs:
  build-and-upload:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build wheel setuptools

      - name: Build wheel package
        run: |
          python -m build --wheel
          rm -r utils.egg-info
          rm -r build
          
      - name: Upload to S3 etl utils
        env:
          S3_BUCKET: ${{ secrets.S3_BUCKET }}
        run: |
          WHEEL_FILE=$(find dist -name "*.whl")
          # Construct and verify S3 path
          S3_PATH="s3://${S3_BUCKET}/etl-artifacts/code/"
          echo "Uploading to: $S3_PATH"
          
          aws s3 cp dist  "$S3_PATH" --recursive \

      - name: Upload to S3 etl code
        env:
          S3_BUCKET: ${{ secrets.S3_BUCKET }}
        run: |
             aws s3 cp src/etl-artifacts/glue_jobs/scripts s3://${S3_BUCKET}/etl-artifacts/code/ \
                 --recursive