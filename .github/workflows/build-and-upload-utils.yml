name: Build and Upload Utils Package

on:
  push:
    paths:
      - 'src/utils/**'
      - '.github/workflows/build-and-upload-utils.yml'
    branches:
      - main
  workflow_dispatch:  # Allow manual triggering

env:
  PYTHON_VERSION: '3.9'
  UTILS_DIR: 'src/utils'

jobs:
  build-and-upload:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build wheel setuptools

      - name: Create setup.py
        run: |
          cat > ${{ env.UTILS_DIR }}/setup.py << 'EOL'
          from setuptools import setup, find_packages

          setup(
              name="utils",
              version="0.1",
              packages=find_packages(),
              install_requires=[
                  "PyGithub==2.2.0",
                  "python-dotenv==1.0.1",
                  "requests==2.31.0",
                  "tqdm==4.66.2",
                  "pyarrow",
                  "boto3"
              ],
          )
          EOL

      - name: Create __init__.py
        run: |
          touch ${{ env.UTILS_DIR }}/__init__.py

      - name: Build wheel package
        run: |
          cd ${{ env.UTILS_DIR }}
          python -m build --wheel

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Upload to S3
        run: |
          WHEEL_FILE=$(find ${{ env.UTILS_DIR }}/dist -name "*.whl")
          echo "Found wheel file: $WHEEL_FILE"
          echo "S3 bucket: ${{ secrets.DEFAULT_S3_BUCKET }}"
          
          # Ensure S3 bucket is not empty
          if [ -z "${{ secrets.DEFAULT_S3_BUCKET }}" ]; then
            echo "Error: DEFAULT_S3_BUCKET secret is empty"
            exit 1
          fi
          
          # Construct and verify S3 path
          S3_PATH="s3://${{ secrets.DEFAULT_S3_BUCKET }}/glue/etl-artifacts/code/utils-0.1-py3-none-any.whl"
          echo "Uploading to: $S3_PATH"
          
          aws s3 cp "$WHEEL_FILE" "$S3_PATH"